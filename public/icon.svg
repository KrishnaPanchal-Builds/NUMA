<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#31103F" />
    </linearGradient>
    
    <linearGradient id="wombGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Soft Glow Aura -->
  <circle cx="256" cy="256" r="190" fill="url(#wombGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- STYLIZED ELEGANT FEMALE REPRODUCTIVE / WOMB & OVARIES MOTIF -->
  <g fill="url(#wombGrad)" filter="url(#glow)">
    
    <!-- Central Uterine / Womb Sanctuary Body -->
    <path d="M256,130 C190,130 150,170 150,220 C150,270 210,330 256,380 C302,330 362,270 362,220 C362,170 322,130 256,130 Z" />

    <!-- Left Fallopian Tube & Ovary -->
    <path d="M165,180 Q100,160 110,220 C115,245 135,245 145,230 Q140,195 180,200 Z" opacity="0.95" />
    <circle cx="105" cy="225" r="22" fill="#F472B6" />
    <circle cx="105" cy="225" r="12" fill="#FFFFFF" opacity="0.8" />

    <!-- Right Fallopian Tube & Ovary -->
    <path d="M347,180 Q412,160 402,220 C397,245 377,245 367,230 Q372,195 332,200 Z" opacity="0.95" />
    <circle cx="407" cy="225" r="22" fill="#F472B6" />
    <circle cx="407" cy="225" r="12" fill="#FFFFFF" opacity="0.8" />

    <!-- Inner Cervical / Follicle Heart Core -->
    <path d="M256,190 C240,175 220,185 220,205 C220,230 256,260 256,260 C256,260 292,230 292,205 C292,185 272,175 256,190 Z" fill="#FFFFFF" />
  </g>

  <!-- Sparkles / Ovulation Follicle Dots -->
  <circle cx="256" cy="100" r="8" fill="#FBBF24" />
  <circle cx="130" cy="140" r="6" fill="#FBBF24" />
  <circle cx="382" cy="140" r="6" fill="#FBBF24" />
</svg>
